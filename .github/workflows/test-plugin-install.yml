name: AgentForge Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ─── Gate 1: Skill Anatomy Validation ────────────────────────────────────
  validate-skills:
    name: Skill Anatomy & Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate all skills (strict)
        run: node scripts/validate-skills.js --strict

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-validation-results
          path: |
            scripts/validate-skills.js
            skills/

  # ─── Gate 2: Cross-Skill Consistency ───────────────────────────────────────
  quality-gates:
    name: Cross-Skill Consistency
    needs: validate-skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run quality gate checks
        run: node scripts/quality-gate.js --ci

      - name: Validate agent personas
        run: node scripts/validate-agents.js

      - name: Generate project stats
        run: node scripts/project-stats.js

  # ─── Gate 3: Script & Hook Integrity ──────────────────────────────────────
  test-hooks:
    name: Hook & Script Tests
    needs: validate-skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck hooks/*.sh || true

      - name: Test session-start hook
        run: bash hooks/session-start-test.sh

      - name: Test simplify-ignore hook
        run: bash hooks/simplify-ignore-test.sh

  # ─── Gate 4: Package Integrity ────────────────────────────────────────────
  build-packages:
    name: Package & Distribution
    needs: [quality-gates, test-hooks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip packages
        run: node scripts/build-packages.js

      - name: Verify all packages exist
        run: |
          missing=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            if [ -d "$dir/scripts" ] && [ ! -f "skills/${name}.zip" ]; then
              echo "Missing package: skills/${name}.zip"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "$missing package(s) missing. Run: node scripts/build-packages.js"
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: skill-packages
          path: skills/*.zip

  # ─── Gate 5: Plugin Installation (optional) ───────────────────────────────
  test-install:
    name: Plugin Installation Test
    needs: build-packages
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Validate plugin manifest
        run: claude plugin validate .

      - name: Add marketplace
        run: claude plugin marketplace add ./

      - name: List marketplaces
        run: claude plugin marketplace list

      - name: Install plugin
        run: claude plugin install agentforge@borhen-agentforge --scope user
